[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravcomm-reproduction"
version = "0.5.0"
description = "Finite-volume shaped-rotor gravity, constrained CF-FSK, and CalculiX reproduction."
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[project.scripts]
gravcomm-figures = "gravcomm.figures:main"

[project.optional-dependencies]
sequence = ["numba>=0.60"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
